{% extends 'base.html' %}
{% block content %}
<!DOCTYPE htm
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BJCree:wght@400;500;600;700&family=Edu+VIC+WA+NT+Hand+Pre:wght@400..700&family=Germania+One&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    body{
        background: linear-gradient(to right,rgba(173, 173, 173, 0.238),rgba(120, 120, 120, 0.304));
    }
    
    .category-container{
        width: 100%;
    }
    .category-video-container{
        position: relative;
        height: 90vh;
        width: 100%;
        overflow: hidden;
    }
    .category-video-container .video-player{
        width: 100%;
        height: 99%;
        object-fit: cover;
        margin-top: 5px;
        border-radius: 8px;
    }
    .category-video-container .category-video-content p{
        font-family: "Edu VIC WA NT Hand Pre", cursive;
        position: absolute;
        font-size: 32px;
        top: 40%;
        overflow: hidden;
        white-space: normal;
        letter-spacing: 1px;
        word-spacing: 15px;
        width: 450px;
        right: 25px;
        font-weight: 500;
        color: white;
    }
    .cursor{
        display: inline-block;
        width: 2px;
        height: 50px;
        background: white;
        animation: blink 0.7s step-end infinite;
        vertical-align: bottom;
    }
    @keyframes blink {
        50% {
            background: transparent;
        }
        
    }

    .category-content{
        background-color: rgba(105, 103, 103, 0.516);
        padding: 50px;
        display: flex;
        gap: 20px;
        justify-content: center;
    }
    .category-head{
        cursor: pointer;
        display: flex;
        background: rgba(255, 255, 255, 0.397);
        padding: 12px 24px;
        border-radius: 12px;
        align-items: center;
    }
    .category-head a{
        text-decoration: none;
        color: black;
    }
    .category-head img{
        height: 30px;
        width: 30px;
    }
    #img{
        width: 50px;
    }
    .category-head p{
        margin-left: 10px;
    }


    .category-sub-content{
        padding: 20px 0px 0px 0px;
        background: rgba(105, 103, 103, 0.516);
        display: grid;
        gap: 20px;
        justify-items: center;
        align-items: center;
        grid-template-columns: repeat(5,1fr);
    }
    .category-sub-content button{
        cursor: grab;
        width: 200px;
        border: none;
        border-radius: 12px;
        justify-content: center;
        align-items: center;
        height: 40px;
    }


    .category-body-container{
        background-color: rgba(105, 103, 103, 0.516);
    }
    .category-body-container .category-body-content{
        display: grid;
        grid-template-columns: repeat(5,1fr);
        padding: 75px 50px 0px 50px;
        gap: 30px;
        justify-content: center;
    }
    .category-body-container .category-body-content .food-menu{
        position: relative;
        height: 350px;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 0px 12px rgba(106, 95, 181, 0.558);
    }
    .category-body-container .category-body-content .food-menu a{
        color: black;
    }
    .category-body-container .category-body-content .food-menu a i{
        text-align: end;
        width: 100%;
        padding: 5px 0px 15px 0px;
        cursor: pointer;
        font-size: 22px;
    }
    .category-body-container .category-body-content .food-menu .checkout-btn{
        width: 100%;
        justify-content: center;
        position: absolute;
        bottom: 8px;
        padding-bottom: 10px;
    }
    .category-body-container .category-body-content .food-menu .checkout-btn button{
        width: 80%;
        height: 40px;
        border-radius: 8px;
        border: none;
        outline: none;
        cursor: pointer;
    }
    .category-body-container .category-body-content .food-menu:hover{
        background-color: rgba(156, 155, 155, 0.307);
    }
    .category-body-container .category-body-content .food-menu img{
        height: 200px;
        width: 200px;
        border-radius: 8px;
        display: flex;
        justify-self: center;
    }
    @media (max-width: 1200px){
        .category-sub-content{
            grid-template-columns: repeat(4,1fr);
        }
        .category-body-container .category-body-content{
            grid-template-columns: repeat(4,1fr);
            padding: 60px 30px 30px 30px;
        }
    }

    @media (max-width: 900px){
        .category-video-container{
            height: 60vh;
        }
        .category-video-container .category-video-content p{
            font-size: 24px;
            width: 350px;
            right: 15px;
            top: 30%;
        }
        .cursor{
            height: 36px;
        }
        .category-content{
            padding: 30px 20px;
        }
        .category-sub-content{
            grid-template-columns: repeat(3,1fr);
            padding: 20px;
        }
        .category-body-container .category-body-content{
            grid-template-columns: repeat(3,1fr);
            padding: 50px 20px 20px 20px;
            gap: 20px;
        }
    }

    @media (max-width: 600px){
        .category-video-container{
            height: 45vh;
        }
        .category-video-container .category-video-content p{
            font-size: 18px;
            width: 90%;
            right: 5%;
            left: 5%;
            top: 25%;
            word-spacing: 6px;
            letter-spacing: 0.5px;
        }
        .cursor{
            height: 26px;
        }
        .category-content{
            padding: 20px 10px;
            gap: 12px;
        }
        .category-head{
            padding: 10px 16px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .category-sub-content{
            grid-template-columns: repeat(2,1fr);
            gap: 12px;
            padding: 16px;
        }
        .category-sub-content button{
            width: 100%;
        }
        .category-body-container .category-body-content{
            grid-template-columns: repeat(2,1fr);
            padding: 40px 15px 15px 15px;
            gap: 15px;
        }
        .category-body-container .category-body-content .food-menu{
            height: auto;
            min-height: 300px;
            max-width: 100%;
            padding: 15px;
        }
        .category-body-container .category-body-content .food-menu img{
            height: 150px;
            width: 150px;
        }
    }

    @media (max-width: 420px){
        .category-video-container .category-video-content p{
            font-size: 15px;
            top: 20%;
        }
        .category-sub-content{
            grid-template-columns: 1fr 1fr;
        }
        .category-body-container .category-body-content{
            grid-template-columns: 1fr;
        }
        .category-body-container .category-body-content .food-menu{
            max-width: 280px;
            margin: 0 auto;
        }
    }
</style>
<body>
    <div class="category-container">
        <div class="category-video-container"> 
            <video class="video-player" autoplay muted loop playsinline>
                <source src="/static/media/video/video.mp4" type="video/mp4" >
            </video>
            <div class="category-video-content">
                <p id="text"></p>
            </div>
        </div>

       <div class="category-content">
            <div class="category-head">
                <img src="/static/media/image/categories images/head img/img3.png" alt="">
                <a href="{% url 'categories_list' %}"><p>All Foods</p></a>
            </div>
            <div class="category-head">
                <img src="/static/media/image/categories images/head img/img3.png" alt="">
                <a href="{% url 'food_category' 'veg' %}"><p>Veg Food only</p></a>
            </div>
            <div class="category-head">
                <img src="/static/media/image/categories images/head img/img4.png" alt="">
                <a href="{% url 'food_category' 'non-veg' %}"><p>Non Veg Food only</p></a>
            </div>
        </div>
        <div class="category-sub-content">
            <a href="{% url 'food_category_detail' current_category 'Soup' %}"><button>Soup</button></a>
            <a href="{% url 'food_category_detail' current_category 'Pizza' %}"><button>Pizza</button></a>
            <a href="{% url 'food_category_detail' current_category 'Burger' %}"><button>Burger</button></a>
            <a href="{% url 'food_category_detail' current_category 'Rolls' %}"><button>Rolls</button></a>
            <a href="{% url 'food_category_detail' current_category 'Cakes' %}"><button>Cakes</button></a>
            <a href="{% url 'food_category_detail' current_category 'Drinks' %}"><button>Drinks</button></a>
            <a href="{% url 'food_category_detail' current_category 'Milk Shake' %}"><button>Milk Shake</button></a>
            <a href="{% url 'food_category_detail' current_category 'Fride Rice' %}"><button>Fride Rice</button></a>
            <a href="{% url 'food_category_detail' current_category 'Fride Noodles' %}"><button>Fride Noodles</button></a>
            <a href="{% url 'food_category_detail' current_category  'Sandwich' %}"><button>Sandwich</button></a>
            <a href="{% url 'food_category_detail' current_category 'Ice Cream' %}"><button>Ice Cream</button></a>
            <a href="{% url 'food_category_detail' current_category 'Variety Rice' %}"><button>Variety Rice</button></a>
        </div>
        <div class="category-body-container">
            <div class="category-body-content">
                {% for foodmenu in category %}
                <div class="food-menu" >
                    <div class="checkout-btn">
                        <a href="{% url 'add_cart' foodmenu.id %}"><button>Add to Cart</button></a>
                    </div>
                    <img src="{{foodmenu.food_image.url}}" alt="">
                    <h3>{{foodmenu.food_name}}</h3>
                    <p><span>&#8377.</span>{{foodmenu.food_price}}</p>
                    <p>
                        {% if foodmenu.food_availabity %}
                            Available
                        {% else %}
                            Not Available
                        {% endif %}
                    </p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>





    <script>
        const content = "Hot & delicious meels every day. Quality you can trust, taste you will remember. Affortable dinnig for family and friends...!"
        const text = document.getElementById("text")
        let i = 0 

        function type(){
            if (i < content.length){
                text.innerHTML = text.textContent.replace("|","")
                text.innerHTML += content.charAt(i) + '<span class="cursor"></span>'
                i++
                setTimeout(type,180)
            }
            else{
                setTimeout(()=>{
                    text.textContent=""
                    i = 0
                    type()
                },2000)
            }
        }

        type()
    </script>
</body>
</html>

{% endblock %}
