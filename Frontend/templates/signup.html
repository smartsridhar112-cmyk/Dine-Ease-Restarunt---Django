<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SD Restarunt</title>
  </head>
  <body>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to right, rgba(173,173,173,0.238), rgba(120,120,120,0.304));
        padding: 30px 20px;
      }
      form {
        width: 100%;
        max-width: 480px;
        background: white;
        padding: 40px 35px;
        border-radius: 12px;
        box-shadow: 0px 4px 16px rgba(0,0,0,0.2);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px 20px;
      }
      form div {
        display: flex;
        flex-direction: column;
      }
      form label {
        margin-bottom: 6px;
        font-size: 14px;
        color: #333;
      }
      form input,
      form select {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        background: white;
      }
      form input:focus,
      form select:focus {
        outline: none;
        border-color: #3399cc;
      }
      form p {
        grid-column: 1 / -1;
        color: red;
        font-size: 13px;
        margin: 0;
        word-wrap: break-word;
      }
      form > div:last-of-type {
        grid-column: 1 / -1;
      }
      form button {
        width: 100%;
        height: 42px;
        border: none;
        border-radius: 8px;
        background: #3399cc;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }
      form button:hover {
        background: #287da3;
      }
      body > div {
        width: 100%;
        max-width: 480px;
        text-align: center;
        margin-top: 15px;
      }
      body > div p {
        font-size: 14px;
      }
      body > div a {
        color: #3399cc;
        text-decoration: none;
        font-weight: 600;
      }
      body > div a:hover {
        text-decoration: underline;
      }

      /* ===== Responsive breakpoints ===== */
      @media (max-width: 700px) {
        form {
          grid-template-columns: 1fr;
          max-width: 420px;
          padding: 35px 28px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 20px 15px;
        }
        form {
          padding: 28px 20px;
          border-radius: 10px;
          gap: 14px;
        }
        form input,
        form select {
          height: 38px;
          font-size: 14px;
        }
        form button {
          height: 40px;
          font-size: 15px;
        }
      }

      @media (max-width: 360px) {
        form {
          padding: 22px 16px;
        }
      }
    </style>

    <form method="POST">
      {% csrf_token %}

      <div>
        <label for="">First Name</label>
        <input type="text" name="first_name" />
      </div>
      <div>
        <label for="">Last Name</label>
        <input type="text" name="last_name" />
      </div>
      <div>
        <label>User Name</label>
        <input type="text" name="username" />
      </div>
      <p>{{error}}</p>
      <div>
        <label for="">Password</label>
        <input type="password" name="password" />
      </div>
      <div>
        <label for="">E mail</label>
        <input type="email" name="email" />
      </div>
      <div>
        <label for="">Age</label>
        <input type="number" name="age" />
      </div>
      <div>
        <label for="">Date Of Birth</label>
        <input type="date" name="dateofbirth" />
      </div>
      <div>
        <label for="">Role :</label>
        <select name="role" id="">
          <option value="Admin">Admin</option>
          <option value="Manager">Manager</option>
          <option value="Employee">Employee</option>
          <option value="Customer">Customer</option>
        </select>
      </div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
    <div>
      <p>
        I have account <span><a href="{% url 'login' %}">login</a></span>
      </p>
    </div>
  </body>
</html>
